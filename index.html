<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>打工人时钟</title>
<style>
:root{
  --bg:#000;
  --green:#00ff9d;
  --pink:#ff6ba8;
  --orange:#ff9a6b;
  --gray:#8a8a8a;
  --card:#101010;
  --line:#1e1e1e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  user-select:none;
}
body{
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 18px);
}

/* ---------- 顶部进度条 ---------- */
.topbar{position:relative;padding-right:40px;}
.progress-track{
  height:3px;background:#161616;border-radius:2px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#00ff9d,#00c8ff);
  box-shadow:0 0 12px rgba(0,255,157,.85);
  transition:width .25s linear;
}
.gear{
  position:absolute;top:-14px;right:0;
  background:none;border:none;color:#555;font-size:20px;
  padding:8px;cursor:pointer;line-height:1;
}
.gear:active{color:#aaa;}

/* ---------- 主体 ---------- */
.main{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;
  min-height:0;
}
.term-line{
  font-size:12px;color:#5a5a5a;letter-spacing:2px;height:16px;
}
.status-pill{
  display:inline-flex;align-items:center;
  padding:7px 18px;border-radius:999px;
  background:#141414;border:1px solid #232323;
  font-size:13px;color:#b0b0b0;
  transition:all .25s;
  max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.status-pill[data-status="working"]{color:var(--green);border-color:rgba(0,255,157,.35);background:rgba(0,255,157,.07);}
.status-pill[data-status="break"]{color:var(--orange);border-color:rgba(255,154,107,.35);background:rgba(255,154,107,.07);}
.status-pill[data-status="after"]{color:var(--pink);border-color:rgba(255,107,168,.35);background:rgba(255,107,168,.07);}
.status-pill[data-status="off"]{color:#7fd6ff;border-color:rgba(127,214,255,.3);background:rgba(127,214,255,.06);}

.amount{
  font-size:clamp(42px,13.5vw,70px);
  font-weight:800;
  color:var(--green);
  font-variant-numeric:tabular-nums;
  letter-spacing:-1.5px;
  line-height:1.1;
  text-shadow:0 0 22px rgba(0,255,157,.55),0 0 70px rgba(0,255,157,.22);
  animation:breathe 2.6s ease-in-out infinite;
  transition:opacity .3s;
}
.amount.frozen{
  color:#3a3a3a;
  text-shadow:none;
  animation:none;
}
@keyframes breathe{
  0%,100%{opacity:1;}
  50%{opacity:.78;}
}
.amount-sub{
  font-size:12px;color:#666;letter-spacing:1px;
}

/* ---------- 摸鱼区 ---------- */
.fish-zone{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:14px 0 6px;
}
.fish-btn{
  width:min(86vw,340px);
  padding:17px 0;
  border:none;border-radius:999px;
  background:linear-gradient(135deg,#ff6ba8 0%,#ff9a6b 100%);
  color:#fff;font-size:17px;font-weight:700;letter-spacing:1px;
  box-shadow:0 8px 28px rgba(255,107,168,.35),0 0 0 1px rgba(255,255,255,.08) inset;
  transition:transform .08s ease,box-shadow .2s;
  cursor:pointer;
}
.fish-btn:active{
  transform:scale(.955);
  box-shadow:0 4px 16px rgba(255,107,168,.5);
}
.fish-count{font-size:12px;color:#5e5e5e;letter-spacing:.5px;}

/* ---------- 底部文案 ---------- */
.quote{
  text-align:center;
  font-size:13px;color:#6b6b6b;line-height:1.6;
  padding:6px 10px 0;
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .4s;
}

/* ---------- 飘字 ---------- */
.float-text{
  position:fixed;
  transform:translate(-50%,-50%);
  font-size:20px;font-weight:800;
  pointer-events:none;z-index:999;
  animation:floatUp .95s cubic-bezier(.2,.7,.4,1) forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
  20%{opacity:1;transform:translate(-50%,-60%) scale(1.1);}
  100%{opacity:0;transform:translate(-50%,-220%) scale(1.4);}
}

/* ---------- 设置面板 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transition:opacity .28s;z-index:100;
  backdrop-filter:blur(3px);
}
.overlay.show{opacity:1;pointer-events:auto;}
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:#0c0c0c;
  border-radius:22px 22px 0 0;
  border-top:1px solid #1d1d1d;
  padding:12px 22px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(105%);
  transition:transform .32s cubic-bezier(.32,.72,.28,1);
  max-height:88vh;overflow-y:auto;
}
.panel.show{transform:translateY(0);}
.panel-handle{
  width:38px;height:4px;border-radius:2px;background:#2a2a2a;
  margin:0 auto 18px;
}
.panel-title{
  font-size:19px;font-weight:700;margin:0 0 20px;text-align:center;
  letter-spacing:.5px;
}
.form{display:flex;flex-direction:column;gap:13px;}
.row{display:flex;gap:12px;}
.row .field{flex:1;}
.field{display:flex;flex-direction:column;gap:7px;}
.field span{font-size:12px;color:#6d6d6d;letter-spacing:.5px;}
.field input{
  background:#161616;border:1px solid #242424;border-radius:12px;
  padding:13px 14px;color:#fff;font-size:16px;
  font-variant-numeric:tabular-nums;
  outline:none;transition:border-color .2s;
  width:100%;
  -webkit-appearance:none;appearance:none;
}
.field input:focus{border-color:rgba(0,255,157,.5);}
.field input::placeholder{color:#3a3a3a;}
.primary-btn{
  width:100%;margin-top:22px;padding:17px 0;
  border:none;border-radius:14px;
  background:linear-gradient(135deg,#00ff9d,#00c8ff);
  color:#04150e;font-size:17px;font-weight:800;letter-spacing:2px;
  cursor:pointer;transition:transform .08s;
}
.primary-btn:active{transform:scale(.97);}
.err{
  color:#ff5c5c;font-size:12px;text-align:center;
  height:16px;margin-top:6px;
}

/* ---------- 鸡汤 Toast ---------- */
.toast{
  position:fixed;left:50%;top:14%;
  transform:translate(-50%,-16px);
  background:rgba(20,20,20,.96);
  border:1px solid #262626;
  color:#d8d8d8;font-size:14px;line-height:1.6;
  padding:16px 22px;border-radius:16px;
  max-width:84vw;text-align:center;
  opacity:0;pointer-events:none;z-index:200;
  transition:opacity .35s,transform .35s;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <button class="gear" id="gearBtn" aria-label="设置">⚙️</button>
</div>

<div class="main">
  <div class="term-line" id="termLine"></div>
  <div class="status-pill" id="statusPill" data-status="before">准备中…</div>
  <div class="amount" id="amount">¥ 0.0000</div>
  <div class="amount-sub" id="amountSub">今日已赚</div>
</div>

<div class="fish-zone">
  <button class="fish-btn" id="fishBtn">🐟 摸鱼打卡</button>
  <div class="fish-count" id="fishCount">今日已带薪摸鱼 0 次</div>
</div>

<div class="quote" id="quote">打工人的每一秒，都在发光。</div>

<!-- 设置面板 -->
<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <h2 class="panel-title" id="panelTitle">老板，你月薪多少？</h2>
  <div class="form">
    <label class="field">
      <span>月薪（元）</span>
      <input type="number" id="fSalary" inputmode="decimal" placeholder="10000">
    </label>
    <label class="field">
      <span>每月工作天数</span>
      <input type="number" id="fWorkDays" inputmode="numeric" placeholder="22">
    </label>
    <div class="row">
      <label class="field"><span>上班时间</span><input type="time" id="fStart" value="09:00"></label>
      <label class="field"><span>下班时间</span><input type="time" id="fEnd" value="18:00"></label>
    </div>
    <div class="row">
      <label class="field"><span>午休开始</span><input type="time" id="fLunchS" value="12:00"></label>
      <label class="field"><span>午休结束</span><input type="time" id="fLunchE" value="13:00"></label>
    </div>
    <div class="row">
      <label class="field"><span>晚休开始（可选）</span><input type="time" id="fDinnerS"></label>
      <label class="field"><span>晚休结束（可选）</span><input type="time" id="fDinnerE"></label>
    </div>
  </div>
  <div class="err" id="errMsg"></div>
  <button class="primary-btn" id="saveBtn">开启打工</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 基础工具
   ========================================================= */
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2,'0');
const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

/** 'HH:MM' -> 指定基准日期的 Date */
function timeToDate(hhmm, base){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(base);
  d.setHours(h||0, m||0, 0, 0);
  return d;
}

/** 两个时间区间的重叠秒数 */
function overlapSec(a1,a2,b1,b2){
  const s = Math.max(a1.getTime(), b1.getTime());
  const e = Math.min(a2.getTime(), b2.getTime());
  return e > s ? (e - s) / 1000 : 0;
}

/* =========================================================
   1. 节假日数据（离线内置，可后续换 Timor API 动态更新）
   ========================================================= */
// 放假日：日期 -> 节日名
const HOLIDAYS = {
  // ---- 2025 ----
  '2025-01-01':'元旦',
  '2025-01-28':'春节','2025-01-29':'春节','2025-01-30':'春节','2025-01-31':'春节',
  '2025-02-01':'春节','2025-02-02':'春节','2025-02-03':'春节','2025-02-04':'春节',
  '2025-04-04':'清明节','2025-04-05':'清明节','2025-04-06':'清明节',
  '2025-05-01':'劳动节','2025-05-02':'劳动节','2025-05-03':'劳动节',
  '2025-05-04':'劳动节','2025-05-05':'劳动节',
  '2025-05-31':'端午节','2025-06-01':'端午节','2025-06-02':'端午节',
  '2025-10-01':'国庆节','2025-10-02':'国庆节','2025-10-03':'国庆节','2025-10-04':'国庆节',
  '2025-10-05':'国庆节','2025-10-06':'国庆节','2025-10-07':'国庆节','2025-10-08':'国庆节',
};

// 调休上班日：日期 -> 说明
const MAKEUP_DAYS = {
  '2025-01-26':'春节调休',
  '2025-02-08':'春节调休',
  '2025-04-27':'劳动节调休',
  '2025-09-28':'国庆调休',
  '2025-10-11':'国庆调休',
};

/**
 * 节假日 API 兜底方案：
 * 优先使用内置表；如需接 Timor API，把下面函数改成异步拉取后
 * 写入 HOLIDAYS / MAKEUP_DAYS 再 render() 即可，失败静默降级为「仅判断周末」。
 */
async function syncHolidayFromAPI(year){
  try{
    const res = await fetch(`https://timor.tech/api/holiday/year/${year}`, {cache:'no-store'});
    if(!res.ok) return false;
    const data = await res.json();
    if(!data || !data.holiday) return false;
    for(const key in data.holiday){
      const item = data.holiday[key];          // { holiday:true/false, name, date }
      const d = `${year}-${key}`;
      if(item.holiday) HOLIDAYS[d] = item.name;
      else MAKEUP_DAYS[d] = item.name + '调休';
    }
    return true;
  }catch(e){
    return false;  // 断网 → 静默降级，核心计时不受影响
  }
}

/* =========================================================
   2. 二十四节气（21 世纪通用近似算法，误差 ≤1 天）
   ========================================================= */
const TERM_C = [5.4055,20.12,3.87,18.73,5.63,20.646,4.81,20.1,5.52,21.04,5.678,21.37,
                7.108,22.83,7.5,23.13,7.646,23.042,8.318,23.438,7.438,22.36,7.18,21.94];
const TERM_NAME = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至',
                   '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];

function getSolarTerm(date){
  const Y = date.getFullYear() % 100;
  const L = Math.floor(Y / 4);
  const m = date.getMonth() + 1;
  const d = date.getDate();
  for(let i = 0; i < 24; i++){
    if(Math.floor(i/2) + 1 !== m) continue;
    const day = Math.floor(Y * 0.2422 + TERM_C[i]) - L;
    if(day === d) return TERM_NAME[i];
  }
  return null;
}

/* =========================================================
   3. 配置读写
   ========================================================= */
const CFG_KEY = 'dgr_cfg_v1';
const DEFAULTS = {
  salary: 0,
  workDays: 22,
  workStart: '09:00',
  workEnd: '18:00',
  lunchStart: '12:00',
  lunchEnd: '13:00',
  dinnerStart: '',
  dinnerEnd: '',
};

let cfg = null;

function loadCfg(){
  try{
    const raw = JSON.parse(localStorage.getItem(CFG_KEY));
    if(raw && typeof raw.salary === 'number' && raw.salary > 0) return Object.assign({}, DEFAULTS, raw);
  }catch(e){}
  return null;
}
function persistCfg(c){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){}
}

/* =========================================================
   4. 核心计算引擎（时间戳差值法 —— 防后台杀进程的关键）
   ========================================================= */
function computeState(now, cfg){
  const todayStr = fmtDate(now);
  const holidayName = HOLIDAYS[todayStr] || '';
  const makeupName  = MAKEUP_DAYS[todayStr] || '';
  const isWeekend   = now.getDay() === 0 || now.getDay() === 6;

  // 优先级：调休上班 > 法定节假日 > 周末 > 普通工作日
  const isWorkday = makeupName ? true : (holidayName ? false : !isWeekend);

  const daySalary = cfg.salary / (cfg.workDays || 22);

  /* ---------- 非工作日 ---------- */
  if(!isWorkday){
    let pill;
    if(holidayName)      pill = `${holidayName}快乐，搞什么钱，去玩！`;
    else if(isWeekend)   pill = '周末快乐，搞什么钱，去玩！';
    else                 pill = '今天休息，去玩！';
    return {
      status: 'off', earned: 0, progress: 1, daySalary,
      pillText: pill, isWorkday: false, holidayName,
    };
  }

  /* ---------- 构建今日时间轴 ---------- */
  const start = timeToDate(cfg.workStart, now);
  const end   = timeToDate(cfg.workEnd,   now);

  const breaks = [];
  if(cfg.lunchStart && cfg.lunchEnd){
    breaks.push([timeToDate(cfg.lunchStart, now), timeToDate(cfg.lunchEnd, now)]);
  }
  if(cfg.dinnerStart && cfg.dinnerEnd){
    breaks.push([timeToDate(cfg.dinnerStart, now), timeToDate(cfg.dinnerEnd, now)]);
  }

  // 今日总计薪秒数
  let totalSec = (end - start) / 1000;
  for(const [bs, be] of breaks) totalSec -= overlapSec(start, end, bs, be);
  if(totalSec <= 0) totalSec = 1;   // 防御：异常配置兜底

  /* ---------- 状态判定 ---------- */
  let status;
  if(now < start)        status = 'before';
  else if(now >= end)    status = 'after';
  else if(breaks.some(([bs,be]) => now >= bs && now < be)) status = 'break';
  else                   status = 'working';

  /* ---------- 已工作秒数（纯时间戳推导，无累加） ---------- */
  let workedSec = 0;
  if(now >= start){
    const cut = now < end ? now : end;          // 不越过下班时间
    workedSec = (cut - start) / 1000;
    for(const [bs, be] of breaks){
      workedSec -= overlapSec(start, cut, bs, be);   // 扣掉已度过的休息时段
    }
  }
  workedSec = Math.max(0, Math.min(workedSec, totalSec));

  /* ---------- 金额 ---------- */
  const perSec = daySalary / totalSec;
  const earned = (status === 'after') ? daySalary : workedSec * perSec;
  const progress = (status === 'after') ? 1 : Math.min(1, workedSec / totalSec);

  /* ---------- 状态胶囊文案 ---------- */
  let pillText;
  if(status === 'before'){
    pillText = '还没到上班时间，再躺会儿';
  }else if(status === 'after'){
    pillText = '今日已下班，快逃！';
  }else if(status === 'break'){
    pillText = '干饭时间，带薪休息';
  }else{
    const left = Math.max(0, Math.floor((end - now) / 1000));
    const h = Math.floor(left / 3600);
    const m = Math.floor((left % 3600) / 60);
    pillText = h > 0 ? `距离下班还有 ${h}小时${m}分` : `距离下班还有 ${m}分`;
  }

  return {
    status, earned, progress, daySalary, pillText,
    isWorkday: true, totalSec, workedSec, perSec,
    isMakeup: !!makeupName,
  };
}

/* =========================================================
   5. 文案系统
   ========================================================= */
const FISH_QUOTES = [
  '带薪拉屎，赚翻了',
  '生产队的驴都不敢这么歇',
  '摸鱼一时爽，一直摸鱼一直爽',
  '老板看不见的地方，就是自由',
  '这不是摸鱼，这是带薪思考人生',
  '工资照发，快乐加倍',
  '我在工位上，但我的灵魂在马尔代夫',
  '摸鱼是打工人最后的倔强',
  '别慌，工资还在跳',
  '认真工作是为了生活，摸鱼也是为了生活',
];

const SOUPS = [
  '你不是在打工，你是在为自己的未来攒路费。',
  '今天也要做一只快乐的、有工资的咸鱼。',
  '工资到账的那一刻，所有的早起都值得。',
  '别人的天花板，是你的起跑线，慢慢来。',
  '生活很苦，但你的工资在涨，这就够了。',
  '不着急，你走的每一步都算数。',
];

/** 时段问候 */
function timeQuote(h){
  if(h < 9)  return '还没上班，先躺一会儿，闹钟还没响。';
  if(h < 10) return '刚泡好咖啡，今天也是带薪拉屎的一天。';
  if(h < 12) return '上午的工资，正在稳步到账。';
  if(h < 13) return '干饭时间，带薪休息，这不叫摸鱼，这叫回血。';
  if(h < 15) return '最难熬的下午来了，深呼吸，工资在跳。';
  if(h < 17) return '摸一会儿是一会儿，反正工资照算。';
  if(h < 18) return '还有10分钟，准备好冲刺下班。';
  return '下班了，快逃。';
}

function pickQuote(now, s){
  if(s.status === 'off')    return s.holidayName ? `${s.holidayName}快乐，搞什么钱，去玩！` : '周末快乐，搞什么钱，去玩！';
  if(s.status === 'before') return '还没上班，先躺一会儿。';
  if(s.status === 'after')  return '今日已下班，快逃！';
  return timeQuote(now.getHours());
}

/* =========================================================
   6. 摸鱼计数（每日 0 点自动重置）
   ========================================================= */
function getFishCount(){
  try{
    const raw = JSON.parse(localStorage.getItem('dgr_fish') || '{}');
    if(raw.date === fmtDate(new Date())) return raw.count || 0;
  }catch(e){}
  return 0;
}
function addFishCount(){
  const count = getFishCount() + 1;
  try{
    localStorage.setItem('dgr_fish', JSON.stringify({date: fmtDate(new Date()), count}));
  }catch(e){}
  return count;
}

/* =========================================================
   7. DOM 引用
   ========================================================= */
const el = {
  progressFill: $('progressFill'),
  statusPill:   $('statusPill'),
  amount:       $('amount'),
  amountSub:    $('amountSub'),
  termLine:     $('termLine'),
  fishBtn:      $('fishBtn'),
  fishCount:    $('fishCount'),
  quote:        $('quote'),
  gearBtn:      $('gearBtn'),
  overlay:      $('overlay'),
  panel:        $('panel'),
  panelTitle:   $('panelTitle'),
  saveBtn:      $('saveBtn'),
  errMsg:       $('errMsg'),
  toast:        $('toast'),
  // 表单
  fSalary:   $('fSalary'),
  fWorkDays: $('fWorkDays'),
  fStart:    $('fStart'),
  fEnd:      $('fEnd'),
  fLunchS:   $('fLunchS'),
  fLunchE:   $('fLunchE'),
  fDinnerS:  $('fDinnerS'),
  fDinnerE:  $('fDinnerE'),
};

/* =========================================================
   8. 渲染
   ========================================================= */
let currentQuote = '';
let lastQuoteAt  = 0;

function render(){
  if(!cfg) return;
  const now = new Date();
  const s = computeState(now, cfg);

  // 顶部进度条
  el.progressFill.style.width = (s.progress * 100).toFixed(2) + '%';

  // 金额（精确到小数点后 4 位）
  el.amount.textContent = '¥ ' + s.earned.toFixed(4);
  el.amount.classList.toggle('frozen', s.status !== 'working');

  // 状态胶囊
  el.statusPill.textContent = s.pillText;
  el.statusPill.dataset.status = s.status;

  // 副标题
  if(s.status === 'after'){
    el.amountSub.textContent = `今日总收入 ¥${s.daySalary.toFixed(2)}`;
  }else if(s.status === 'off'){
    el.amountSub.textContent = '今天不用上班，去玩！';
  }else{
    el.amountSub.textContent = '今日已赚';
  }

  // 节气
  const term = getSolarTerm(now);
  el.termLine.textContent = term ? `今日 ${term}` : '';

  // 底部文案：每 30 秒或状态切换时刷新
  const t = Date.now();
  if(t - lastQuoteAt > 30000 || !currentQuote){
    currentQuote = pickQuote(now, s);
    el.quote.textContent = currentQuote;
    lastQuoteAt = t;
  }
}

/* =========================================================
   9. 摸鱼交互
   ========================================================= */
function spawnFloat(text, x, y){
  const node = document.createElement('div');
  node.className = 'float-text';
  node.textContent = text;
  node.style.left = x + 'px';
  node.style.top  = y + 'px';
  // 绿 / 粉随机
  node.style.color = Math.random() > 0.5 ? '#00ff9d' : '#ff6ba8';
  node.style.textShadow = `0 0 14px ${node.style.color}`;
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 950);
}

el.fishBtn.addEventListener('click', function(e){
  // 1. 计数
  const count = addFishCount();
  el.fishCount.textContent = `今日已带薪摸鱼 ${count} 次`;

  // 2. 震动（Android 生效，iOS Safari 不支持 vibrate，属正常降级）
  if(navigator.vibrate) navigator.vibrate(30);

  // 3. 飘字：优先用点击坐标，兜底用按钮中心
  const rect = el.fishBtn.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width / 2);
  const y = (e.clientY || rect.top + rect.height / 2);
  spawnFloat('+1 摸鱼', x, y - 10);

  // 4. 切换黑话
  currentQuote = FISH_QUOTES[Math.floor(Math.random() * FISH_QUOTES.length)];
  el.quote.textContent = currentQuote;
  lastQuoteAt = Date.now();
});

function refreshFishCount(){
  el.fishCount.textContent = `今日已带薪摸鱼 ${getFishCount()} 次`;
}

/* =========================================================
   10. 设置面板
   ========================================================= */
let isFirstRun = false;

function fillForm(c){
  const v = Object.assign({}, DEFAULTS, c || {});
  el.fSalary.value   = v.salary || '';
  el.fWorkDays.value = v.workDays || 22;
  el.fStart.value    = v.workStart || '09:00';
  el.fEnd.value      = v.workEnd   || '18:00';
  el.fLunchS.value   = v.lunchStart || '12:00';
  el.fLunchE.value   = v.lunchEnd   || '13:00';
  el.fDinnerS.value  = v.dinnerStart || '';
  el.fDinnerE.value  = v.dinnerEnd   || '';
  el.errMsg.textContent = '';
}

function openPanel(first){
  isFirstRun = !!first;
  fillForm(cfg);
  el.panelTitle.textContent = first ? '老板，你月薪多少？' : '设置';
  el.saveBtn.textContent    = first ? '开启打工' : '保存并开始';
  el.overlay.classList.add('show');
  el.panel.classList.add('show');
}

function closePanel(){
  el.overlay.classList.remove('show');
  el.panel.classList.remove('show');
}

el.gearBtn.addEventListener('click', () => openPanel(false));
el.overlay.addEventListener('click', () => { if(!isFirstRun) closePanel(); });

el.saveBtn.addEventListener('click', function(){
  const salary   = parseFloat(el.fSalary.value);
  const workDays = parseInt(el.fWorkDays.value, 10) || 22;
  const workStart = el.fStart.value || '09:00';
  const workEnd   = el.fEnd.value   || '18:00';

  if(!salary || salary <= 0){
    el.errMsg.textContent = '先填个月薪吧，打工人 😢';
    return;
  }
  if(timeToDate(workEnd, new Date()) <= timeToDate(workStart, new Date())){
    el.errMsg.textContent = '下班时间得晚于上班时间哦';
    return;
  }

  const newCfg = {
    salary,
    workDays,
    workStart,
    workEnd,
    lunchStart: el.fLunchS.value || '',
    lunchEnd:   el.fLunchE.value || '',
    dinnerStart: el.fDinnerS.value || '',
    dinnerEnd:   el.fDinnerE.value || '',
  };

  // 晚休必须成对出现
  if((!!newCfg.dinnerStart) !== (!!newCfg.dinnerEnd)){
    el.errMsg.textContent = '晚休时间需要同时填写开始和结束';
    return;
  }

  cfg = newCfg;
  persistCfg(cfg);
  isFirstRun = false;
  closePanel();

  lastQuoteAt = 0;
  render();
});

/* =========================================================
   11. 每日首开鸡汤
   ========================================================= */
function checkDailySoup(){
  const today = fmtDate(new Date());
  let last = '';
  try{ last = localStorage.getItem('dgr_lastopen') || ''; }catch(e){}
  if(last === today) return;

  try{ localStorage.setItem('dgr_lastopen', today); }catch(e){}

  const soup = SOUPS[Math.floor(Math.random() * SOUPS.length)];
  el.toast.textContent = soup;
  el.toast.classList.add('show');
  setTimeout(() => el.toast.classList.remove('show'), 4200);
}

/* =========================================================
   12. 启动
   ========================================================= */
function boot(){
  cfg = loadCfg();
  refreshFishCount();

  if(!cfg){
    // 首次打开：直接弹极简设置卡片，无登录无注册
    openPanel(true);
  }else{
    render();
    checkDailySoup();
  }

  // 主循环：仅驱动渲染，金额永远由时间戳重算 —— 掉帧/被节流都不会导致误差
  setInterval(render, 100);

  // 切回前台立即刷新（解决息屏 / 切后台回来金额滞后）
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){
      render();
      refreshFishCount();   // 跨零点后摸鱼次数自动归零
    }
  });
  window.addEventListener('focus', render);
  window.addEventListener('pageshow', render);

  // 跨零点检测
  let lastDay = fmtDate(new Date());
  setInterval(function(){
    const d = fmtDate(new Date());
    if(d !== lastDay){
      lastDay = d;
      refreshFishCount();
      lastQuoteAt = 0;
      render();
    }
  }, 5000);

  // 节假日数据异步更新（失败静默降级为「仅判断周末」）
  syncHolidayFromAPI(new Date().getFullYear()).then(ok => { if(ok) render(); });
  syncHolidayFromAPI(new Date().getFullYear() + 1);
}

boot();

})();
</script>
